name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  configure:
    name: Configure repository URLs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure repository URLs in mkdocs.yml
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          SITE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"

          sed -i "s|site_url:.*|site_url: ${SITE_URL}|" mkdocs.yml
          sed -i "s|repo_url:.*|repo_url: ${REPO_URL}|" mkdocs.yml
          sed -i "s|repo_name:.*|repo_name: ${GITHUB_REPOSITORY}|" mkdocs.yml
          sed -i "s|link: https://github.com/username/github-repo-template|link: ${REPO_URL}|" mkdocs.yml

          # Update docs badge in README.md
          sed -i "s|https://username.github.io/github-repo-template/|${SITE_URL}|g" README.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit URL configuration
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mkdocs.yml README.md
          git commit -m "docs: auto-configure repository URLs [skip ci]"
          git push

  build:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: configure
    if: always() && (needs.configure.result == 'success' || needs.configure.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
